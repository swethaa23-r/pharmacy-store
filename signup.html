<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account - STACKLY Healthcare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<link href="customer/css/customer.css" rel="stylesheet"/>
</head>
<body class="customer-body">
<div class="auth-wrapper">
<div class="auth-card js-animate-auth" style="padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 450px; background: var(--white);">
<div style="margin-bottom: 24px;">
<a class="brand-logo" href="index.html" style="display: inline-block; margin-bottom: 15px;">
<img src="assets/images/lo.webp" alt="STACKLY Logo" style="height: 60px; width: auto; object-fit: contain;">
</a>
<h2 style="margin-top: 10px; color: var(--secondary); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;">Create Account</h2>
<p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 8px;">Join us for a simpler healthcare experience.</p>
</div>
<form id="signup-form">
<div class="form-group" style="text-align: left; margin-bottom: 16px;">
<input class="form-control" id="signup-name" placeholder="Full Name" required="" style="border-radius: 30px; padding: 14px 20px; background-color: #f0f2f5; border: 1px solid #e1e5eb;" type="text"/>
</div>
<div class="form-group" style="text-align: left; margin-bottom: 16px;">
<input class="form-control" id="signup-email" placeholder="Email Address" required="" style="border-radius: 30px; padding: 14px 20px; background-color: #f0f2f5; border: 1px solid #e1e5eb;" type="email"/>
</div>
<div class="form-group" style="text-align: left; margin-bottom: 16px;">
<input class="form-control" id="signup-phone" placeholder="Phone Number" required="" style="border-radius: 30px; padding: 14px 20px; background-color: #f0f2f5; border: 1px solid #e1e5eb;" type="tel"/>
</div>
<div class="form-group" style="text-align: left; margin-bottom: 16px; position: relative;">
<input class="form-control" id="signup-password" placeholder="Password" required="" style="border-radius: 30px; padding: 14px 20px; background-color: #f0f2f5; border: 1px solid #e1e5eb; width: 100%; box-sizing: border-box;" type="password"/>
<i class="fas fa-eye" onclick="togglePassword('signup-password', this)" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8;"></i>
</div>
<div class="form-group" style="text-align: left; margin-bottom: 16px; position: relative;">
<input class="form-control" id="signup-confirm-password" placeholder="Confirm Password" required="" style="border-radius: 30px; padding: 14px 20px; background-color: #f0f2f5; border: 1px solid #e1e5eb; width: 100%; box-sizing: border-box;" type="password"/>
<i class="fas fa-eye" onclick="togglePassword('signup-confirm-password', this)" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8;"></i>
</div>
<div class="form-group" style="text-align: left; margin-bottom: 16px; position: relative;">
<select class="form-control" id="signup-role" required="" style="border-radius: 30px; padding: 14px 20px; background-color: #f0f2f5; border: 1px solid #e1e5eb; color: #555; appearance: none; width: 100%; box-sizing: border-box;">
<option value="customer" selected>Customer</option>
<option value="admin">Administrator</option>
</select>
<i class="fas fa-chevron-down" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8;"></i>
</div>
<div id="signup-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 15px; display: none;"></div>
<button class="btn btn-primary" style="width: 100%; border-radius: 30px; padding: 14px; font-weight: 600; font-size: 1rem; margin-top: 8px;" type="submit">Create Account</button>
<div style="display: flex; align-items: center; margin: 24px 0; color: var(--text-muted); font-size: 0.9rem;">
<hr style="flex-grow: 1; border: none; border-top: 1px solid #e1e5eb;"/>
<span style="padding: 0 12px; background: #fff; border-radius: 50%; border: 1px solid #e1e5eb; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin: 0 -18px; z-index: 2; position: relative;">or</span>
<hr style="flex-grow: 1; border: none; border-top: 1px solid #e1e5eb;"/>
</div>
<button class="btn btn-outline" style="width: 100%; border-radius: 30px; padding: 14px; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; border-color: #cbd5e1; color: var(--secondary);" type="button" onclick="window.location.href='404.html'">
<i class="fab fa-google"></i> Sign up with Google
</button>
<div style="margin-top: 28px; font-size: 0.95rem; color: var(--text-muted);">
Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 4px;">Login</a>
</div>
</form>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        gsap.from('.js-animate-auth', { y: 30, opacity: 0, duration: 0.8, ease: 'power3.out' });
        
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const errorDiv = document.getElementById('signup-error');
            
            if (!email.includes('@') || !email.includes('.com')) {
                errorDiv.innerText = 'Please enter a valid email address with "@" and ".com".';
                errorDiv.style.display = 'block';
                return;
            }
            if (password !== confirmPassword) {
                errorDiv.innerText = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                return;
            }
            
            errorDiv.style.display = 'none';
            // Redirect to login page
            window.location.href = 'login.html';
        });
    });
</script>
</body>
</html>
